name: Deploy cPanel Production

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact commit SHA already verified on staging
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to deploy to apls.org
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cpanel-production-sftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cpanel-production
      url: https://www.apls.org/
    steps:
      - name: Verify production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "PUBLISH" ]; then
            echo "Production deployment cancelled: confirmation must be PUBLISH."
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.CPANEL_HOST }}
          REMOTE_PORT: ${{ vars.CPANEL_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/apls-cpanel-deploy
          chmod 600 ~/.ssh/apls-cpanel-deploy
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Prepare site files
        run: |
          bash .github/scripts/prepare-site.sh "$RUNNER_TEMP/apls-site" \
            | tee "$RUNNER_TEMP/apls-site-manifest.txt"

      - name: Deploy production site
        env:
          REMOTE_HOST: ${{ vars.CPANEL_HOST }}
          REMOTE_PORT: ${{ vars.CPANEL_PORT }}
          REMOTE_USERNAME: ${{ vars.CPANEL_USERNAME }}
          REMOTE_TARGET: ${{ vars.CPANEL_PRODUCTION_PATH }}
        run: |
          cat > "$RUNNER_TEMP/deploy.sftp" <<EOF
          lcd "$RUNNER_TEMP/apls-site"
          cd "$REMOTE_TARGET"
          put -r *
          put .htaccess
          bye
          EOF
          sftp \
            -b "$RUNNER_TEMP/deploy.sftp" \
            -i ~/.ssh/apls-cpanel-deploy \
            -P "$REMOTE_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$REMOTE_USERNAME@$REMOTE_HOST"