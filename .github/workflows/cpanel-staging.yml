name: Deploy cPanel Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cpanel-staging
      url: https://www.apls.org/_newsite/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.CPANEL_HOST }}
          REMOTE_PORT: ${{ vars.CPANEL_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/apls-cpanel-deploy
          chmod 600 ~/.ssh/apls-cpanel-deploy
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Prepare site files
        run: |
          mkdir -p "$RUNNER_TEMP/apls-site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/apls-site"
          rm -rf \
            "$RUNNER_TEMP/apls-site/.github" \
            "$RUNNER_TEMP/apls-site/audit-prelaunch-2026-08-17" \
            "$RUNNER_TEMP/apls-site/logo-concepts.html" \
            "$RUNNER_TEMP/apls-site/social-card-preview.html" \
            "$RUNNER_TEMP/apls-site/social-card-preview.png" \
            "$RUNNER_TEMP/apls-site/README.md"

      - name: Install SFTP mirror tool
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy staging site
        env:
          REMOTE_HOST: ${{ vars.CPANEL_HOST }}
          REMOTE_PORT: ${{ vars.CPANEL_PORT }}
          REMOTE_USERNAME: ${{ vars.CPANEL_USERNAME }}
          REMOTE_TARGET: ${{ vars.CPANEL_STAGING_PATH }}
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/apls-cpanel-deploy -o StrictHostKeyChecking=yes';
            set net:max-retries 2;
            set net:timeout 20;
            open -u '$REMOTE_USERNAME,' 'sftp://$REMOTE_HOST:$REMOTE_PORT';
            mirror --reverse --delete --verbose '$RUNNER_TEMP/apls-site/' '$REMOTE_TARGET';
            bye
          "