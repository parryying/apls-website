name = "apls-content-studio-api"
main = "worker.js"
compatibility_date = "2026-08-21"

[[d1_databases]]
binding = "DB"
database_name = "apls-content-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
GITHUB_OWNER = "parryying"
GITHUB_REPO = "apls-website"
GITHUB_BASE_BRANCH = "main"
CMS_ORIGIN = "https://cms.apls.org"

# Configure these with `wrangler secret put`:
# CF_ACCESS_AUD
# CF_ACCESS_TEAM_DOMAIN
# CMS_ALLOWED_EMAILS
# GITHUB_APP_ID
# GITHUB_INSTALLATION_ID
# GITHUB_PRIVATE_KEY