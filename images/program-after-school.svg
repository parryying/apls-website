<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of children at an after-school language class with books">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF1E4"/><stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#skyA)"/>
  <rect x="0" y="474" width="800" height="46" fill="#F5C45B" opacity="0.85"/>
  <!-- clock -->
  <g transform="translate(120,120)">
    <circle r="60" fill="#fff" stroke="#3B5A4A" stroke-width="8"/>
    <line x1="0" y1="0" x2="0" y2="-38" stroke="#E5714E" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="28" y2="8" stroke="#3B5A4A" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- open book big -->
  <g transform="translate(400,300)">
    <path d="M-160 40 Q-80 10 0 40 V150 Q-80 120 -160 150 Z" fill="#2E8296"/>
    <path d="M160 40 Q80 10 0 40 V150 Q80 120 160 150 Z" fill="#3B7f90"/>
    <path d="M0 40 V150" stroke="#1f5b68" stroke-width="4"/>
    <text x="-80" y="95" font-family="Nunito, sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">中文</text>
    <text x="80" y="95" font-family="Nunito, sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">日本語</text>
  </g>
  <!-- two kids peeking -->
  <g transform="translate(300,180)">
    <circle cx="0" cy="0" r="42" fill="#F7C9A8"/>
    <path d="M-42 -8 a42 36 0 0 1 84 0 v-6 a42 36 0 0 0 -84 0 z" fill="#5b4636"/>
    <circle cx="-14" cy="-2" r="5" fill="#3B2A20"/><circle cx="14" cy="-2" r="5" fill="#3B2A20"/>
    <path d="M-12 16 q12 10 24 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(500,180)">
    <circle cx="0" cy="0" r="42" fill="#F3B98C"/>
    <path d="M-42 -8 a42 36 0 0 1 84 0 v-6 a42 36 0 0 0 -84 0 z" fill="#2b2016"/>
    <circle cx="-14" cy="-2" r="5" fill="#3B2A20"/><circle cx="14" cy="-2" r="5" fill="#3B2A20"/>
    <path d="M-12 16 q12 10 24 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- backpack -->
  <g transform="translate(660,330)">
    <rect x="0" y="0" width="90" height="110" rx="24" fill="#E5714E"/>
    <rect x="18" y="40" width="54" height="46" rx="12" fill="#fff" opacity="0.85"/>
    <rect x="30" y="-14" width="30" height="30" rx="10" fill="#c85a3a"/>
  </g>
</svg>
