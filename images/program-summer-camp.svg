<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of a summer camp scene with sun, tents, kite and trees">
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF1F5"/><stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#skyS)"/>
  <!-- sun -->
  <g transform="translate(680,110)">
    <circle r="56" fill="#F5C45B"/>
    <g stroke="#F5C45B" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-74" x2="0" y2="-92"/><line x1="0" y1="74" x2="0" y2="92"/>
      <line x1="-74" y1="0" x2="-92" y2="0"/><line x1="74" y1="0" x2="92" y2="0"/>
      <line x1="-52" y1="-52" x2="-66" y2="-66"/><line x1="52" y1="52" x2="66" y2="66"/>
      <line x1="52" y1="-52" x2="66" y2="-66"/><line x1="-52" y1="52" x2="-66" y2="66"/>
    </g>
  </g>
  <!-- ground -->
  <rect x="0" y="420" width="800" height="100" fill="#6FA85A"/>
  <!-- trees -->
  <g transform="translate(90,300)"><rect x="-10" y="80" width="20" height="60" fill="#8a5a33"/><circle cx="0" cy="60" r="60" fill="#4f8f43"/></g>
  <g transform="translate(180,330)"><rect x="-8" y="60" width="16" height="50" fill="#8a5a33"/><circle cx="0" cy="45" r="48" fill="#5ea24f"/></g>
  <!-- tent -->
  <g transform="translate(330,300)">
    <path d="M0 0 L90 130 L-90 130 Z" fill="#E5714E"/>
    <path d="M0 0 L40 130 L-40 130 Z" fill="#FBF6EC"/>
    <path d="M0 0 L90 130 L-90 130 Z" fill="none" stroke="#c85a3a" stroke-width="4"/>
  </g>
  <!-- kite -->
  <g transform="translate(520,150)">
    <path d="M0 -40 L34 0 L0 40 L-34 0 Z" fill="#2E8296"/>
    <path d="M0 -40 L0 40 M-34 0 L34 0" stroke="#fff" stroke-width="3"/>
    <path d="M0 40 q10 30 -6 46 q16 6 6 30" stroke="#3B5A4A" stroke-width="3" fill="none"/>
  </g>
  <!-- child with balloon -->
  <g transform="translate(470,330)">
    <rect x="-34" y="40" width="68" height="90" rx="24" fill="#F5C45B"/>
    <circle cx="0" cy="8" r="40" fill="#F7C9A8"/>
    <path d="M-40 0 a40 34 0 0 1 80 0 v-6 a40 34 0 0 0 -80 0 z" fill="#5b4636"/>
    <circle cx="-13" cy="6" r="4.5" fill="#3B2A20"/><circle cx="13" cy="6" r="4.5" fill="#3B2A20"/>
    <path d="M-11 22 q11 9 22 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
