<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" role="img" aria-label="Asia Pacific Language School logo">
  <title>Asia Pacific Language School</title>
  <desc>Emblem of two leaves growing from one root beneath a rising sun, beside the school name.</desc>

  <defs>
    <linearGradient id="apls-leafL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E8296"/>
      <stop offset="1" stop-color="#3FA0B4"/>
    </linearGradient>
    <linearGradient id="apls-leafR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5C9A48"/>
      <stop offset="1" stop-color="#7DBB62"/>
    </linearGradient>
    <radialGradient id="apls-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8D07A"/>
      <stop offset="1" stop-color="#E5714E"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap');
      .apls-name { font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif; font-weight: 800; fill: #3B5A4A; }
      .apls-tag  { font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif; font-weight: 600; fill: #2E8296; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- ===== Emblem ===== -->
  <g transform="translate(2,2)">
    <circle cx="48" cy="48" r="48" fill="#FBF6EC"/>
    <circle cx="48" cy="48" r="48" fill="none" stroke="#6FA85A" stroke-opacity="0.35" stroke-width="2.6"/>
    <!-- Rising Pacific sun -->
    <circle cx="48" cy="24" r="9" fill="url(#apls-sun)"/>
    <!-- Root / cradle -->
    <path d="M31 79 Q48 89 65 79" fill="none" stroke="#3B5A4A" stroke-width="3.9" stroke-linecap="round"/>
    <!-- Stem -->
    <path d="M48 79 C 48 69, 47 62, 48 51" fill="none" stroke="#3B5A4A" stroke-width="3.9" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M48 56 C 33 56, 24 47, 24 34 C 39 36, 48 44, 48 56 Z" fill="url(#apls-leafL)"/>
    <path d="M45 53 C 38 48, 32 43, 27 37" fill="none" stroke="#FBF6EC" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round"/>
    <!-- Right leaf -->
    <path d="M48 53 C 63 53, 72 44, 72 31 C 57 33, 48 41, 48 53 Z" fill="url(#apls-leafR)"/>
    <path d="M51 50 C 58 45, 64 41, 69 35" fill="none" stroke="#FBF6EC" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text class="apls-name" x="112" y="50" font-size="25">Asia Pacific Language School</text>
  <text class="apls-tag"  x="114" y="74" font-size="12.5">CHINESE &amp; JAPANESE &#183; SINCE 1995</text>
</svg>
