<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of a kindergarten child writing characters at a desk">
  <defs>
    <linearGradient id="skyK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF4EA"/><stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#skyK)"/>
  <rect x="0" y="472" width="800" height="48" fill="#2E8296" opacity="0.85"/>
  <!-- board -->
  <rect x="70" y="60" width="360" height="190" rx="14" fill="#3B5A4A"/>
  <rect x="70" y="60" width="360" height="190" rx="14" fill="none" stroke="#E7DDC9" stroke-width="6"/>
  <text x="250" y="140" font-family="Nunito, sans-serif" font-size="58" font-weight="800" fill="#F5C45B" text-anchor="middle">学 ・ まな</text>
  <text x="250" y="205" font-family="Nunito, sans-serif" font-size="34" font-weight="700" fill="#FBF6EC" text-anchor="middle">1 2 3 &#183; A B C</text>
  <!-- desk -->
  <rect x="470" y="330" width="280" height="26" rx="8" fill="#d9a441"/>
  <rect x="500" y="356" width="18" height="110" fill="#c98f33"/>
  <rect x="702" y="356" width="18" height="110" fill="#c98f33"/>
  <!-- book -->
  <g transform="translate(560,300)">
    <rect x="0" y="0" width="120" height="34" rx="5" fill="#E5714E"/>
    <line x1="60" y1="2" x2="60" y2="32" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- child seated -->
  <g transform="translate(610,250)">
    <rect x="-42" y="40" width="84" height="90" rx="26" fill="#6FA85A"/>
    <circle cx="0" cy="4" r="46" fill="#F3B98C"/>
    <path d="M-46 -4 a46 40 0 0 1 92 0 v-8 a46 40 0 0 0 -92 0 z" fill="#2b2016"/>
    <circle cx="-15" cy="2" r="5" fill="#3B2A20"/><circle cx="15" cy="2" r="5" fill="#3B2A20"/>
    <path d="M-13 20 q13 10 26 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="30" y="60" width="70" height="14" rx="7" fill="#F3B98C" transform="rotate(20 30 60)"/>
  </g>
