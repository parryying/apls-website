<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of children learning Chinese and Japanese at APLS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE9DC"/>
      <stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="690" cy="110" r="46" fill="#F5C45B"/>
  <g stroke="#F5C45B" stroke-width="8" stroke-linecap="round">
    <line x1="690" y1="34" x2="690" y2="52"/>
    <line x1="770" y1="110" x2="752" y2="110"/>
    <line x1="746" y1="54" x2="733" y2="67"/>
    <line x1="634" y1="54" x2="647" y2="67"/>
  </g>

  <!-- cherry branch top-left -->
  <path d="M0 64 C60 74 92 42 150 62" stroke="#6FA85A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g fill="#E58AA0">
    <circle cx="62" cy="58" r="12"/><circle cx="98" cy="45" r="12"/><circle cx="132" cy="62" r="12"/><circle cx="30" cy="72" r="10"/>
  </g>

  <!-- floor rug -->
  <ellipse cx="400" cy="522" rx="370" ry="72" fill="#6FA85A" opacity="0.22"/>

  <!-- bookshelf -->
  <rect x="44" y="300" width="120" height="182" rx="10" fill="#3B5A4A"/>
  <rect x="58" y="316" width="18" height="70" rx="3" fill="#E5714E"/>
  <rect x="81" y="316" width="18" height="70" rx="3" fill="#2E8296"/>
  <rect x="104" y="316" width="18" height="70" rx="3" fill="#F5C45B"/>
  <rect x="127" y="316" width="18" height="70" rx="3" fill="#6FA85A"/>
  <rect x="58" y="398" width="90" height="16" rx="3" fill="#F4EBDC"/>

  <!-- speech bubble 你好 -->
  <rect x="250" y="120" width="120" height="70" rx="18" fill="#ffffff" stroke="#2E8296" stroke-width="3"/>
  <text x="310" y="168" font-family="'Nunito',sans-serif" font-weight="800" font-size="40" fill="#2E8296" text-anchor="middle">你好</text>
  <path d="M292 188 l0 26 l22 -20 z" fill="#ffffff" stroke="#2E8296" stroke-width="3"/>

  <!-- speech bubble こんにちは -->
  <rect x="430" y="100" width="210" height="70" rx="18" fill="#ffffff" stroke="#E5714E" stroke-width="3"/>
  <text x="535" y="146" font-family="'Nunito',sans-serif" font-weight="800" font-size="34" fill="#E5714E" text-anchor="middle">こんにちは</text>
  <path d="M470 168 l0 26 l22 -20 z" fill="#ffffff" stroke="#E5714E" stroke-width="3"/>

  <!-- teacher -->
  <rect x="592" y="360" width="90" height="132" rx="42" fill="#2E8296"/>
  <circle cx="637" cy="336" r="34" fill="#E8B48C"/>
  <path d="M603 332 a34 34 0 0 1 68 0 z" fill="#3B5A4A"/>

  <!-- child 1 (coral) -->
  <rect x="250" y="400" width="82" height="100" rx="36" fill="#E5714E"/>
  <circle cx="291" cy="382" r="30" fill="#F1C7A6"/>
  <path d="M261 380 a30 30 0 0 1 60 0 z" fill="#3B5A4A"/>

  <!-- child 2 (gold) -->
  <rect x="360" y="406" width="82" height="94" rx="36" fill="#F5C45B"/>
  <circle cx="401" cy="388" r="28" fill="#E8B48C"/>
  <path d="M373 388 a28 28 0 0 1 56 0 z" fill="#23303E"/>

  <!-- open book center -->
  <path d="M300 494 q100 -34 200 0 l0 30 q-100 -28 -200 0 z" fill="#ffffff"/>
  <path d="M300 494 q100 -34 200 0" fill="none" stroke="#D8CBB0" stroke-width="3"/>
  <line x1="400" y1="480" x2="400" y2="520" stroke="#D8CBB0" stroke-width="3"/>

  <!-- plant -->
  <rect x="704" y="452" width="46" height="40" rx="6" fill="#E5714E"/>
  <path d="M727 452 c-30 -20 -30 -62 0 -72 c30 10 30 52 0 72z" fill="#6FA85A"/>
</svg>
