<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of preschoolers playing and learning">
  <defs>
    <linearGradient id="skyP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE9DC"/><stop offset="1" stop-color="#FBF6EC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#skyP)"/>
  <circle cx="120" cy="110" r="52" fill="#F5C45B"/>
  <g opacity="0.5" fill="#6FA85A">
    <circle cx="690" cy="470" r="70"/><circle cx="750" cy="470" r="55"/><circle cx="630" cy="480" r="50"/>
  </g>
  <rect x="0" y="470" width="800" height="50" fill="#6FA85A" opacity="0.85"/>
  <!-- speech bubbles -->
  <g>
    <rect x="250" y="60" rx="18" width="130" height="66" fill="#fff" stroke="#E5714E" stroke-width="3"/>
    <text x="315" y="103" font-family="Nunito, sans-serif" font-size="34" font-weight="800" fill="#E5714E" text-anchor="middle">你好</text>
    <rect x="430" y="90" rx="18" width="180" height="66" fill="#fff" stroke="#2E8296" stroke-width="3"/>
    <text x="520" y="133" font-family="Nunito, sans-serif" font-size="30" font-weight="800" fill="#2E8296" text-anchor="middle">こんにちは</text>
  </g>
  <!-- child 1 -->
  <g transform="translate(250,250)">
    <rect x="-38" y="60" width="76" height="120" rx="30" fill="#E5714E"/>
    <circle cx="0" cy="20" r="46" fill="#F7C9A8"/>
    <path d="M-46 12 a46 40 0 0 1 92 0 v-6 a46 40 0 0 0 -92 0 z" fill="#5b4636"/>
    <circle cx="-15" cy="18" r="5" fill="#3B2A20"/><circle cx="15" cy="18" r="5" fill="#3B2A20"/>
    <path d="M-14 34 q14 12 28 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- child 2 -->
  <g transform="translate(430,270)">
    <rect x="-40" y="60" width="80" height="120" rx="30" fill="#2E8296"/>
    <circle cx="0" cy="20" r="48" fill="#F3B98C"/>
    <path d="M-48 10 a48 42 0 0 1 96 0 v-8 a48 42 0 0 0 -96 0 z" fill="#2b2016"/>
    <circle cx="-16" cy="18" r="5" fill="#3B2A20"/><circle cx="16" cy="18" r="5" fill="#3B2A20"/>
    <path d="M-15 36 q15 12 30 0" stroke="#3B2A20" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- building blocks -->
  <g transform="translate(560,360)">
    <rect x="0" y="60" width="54" height="54" rx="8" fill="#F5C45B"/>
    <rect x="60" y="60" width="54" height="54" rx="8" fill="#E5714E"/>
    <rect x="30" y="4" width="54" height="54" rx="8" fill="#2E8296"/>
    <text x="27" y="98" font-family="Nunito, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">A</text>
    <text x="87" y="98" font-family="Nunito, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">あ</text>
  </g>
</svg>
